# Action Cable runs on Redis — the same Redis as Sidekiq (REDIS_URL). Broadcasts
# come from background jobs as well as web requests (recipe import progress is
# sent from the Sidekiq worker), so every environment with a separate worker
# process needs a shared adapter: the in-process async adapter would silently
# drop anything a worker sends.
development:
  adapter: redis
  url: <%= ENV.fetch("REDIS_URL", "redis://localhost:6379/1") %>
  channel_prefix: recipe_bank_development

test:
  adapter: test

production:
  adapter: redis
  url: <%= ENV.fetch("REDIS_URL", "redis://localhost:6379/1") %>
  channel_prefix: recipe_bank_production
